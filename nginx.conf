server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare sits in front of Zeabur and caches responses at the edge by
    # default — confirmed live twice: once serving a stale homepage for
    # hours after a deploy, then again serving a stale style.css (missing
    # a new CSS rule) even after the HTML itself had updated, because the
    # <link> has no cache-busting query string. Force revalidation on every
    # request for HTML/CSS/vCard so a push always shows up immediately —
    # this is a low-traffic card site, not worth the staleness risk to save
    # a CSS fetch.
    location ~ \.(html|css|vcf)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
