server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare sits in front of Zeabur and caches HTML at the edge by
    # default — confirmed live: it served a stale homepage for hours after
    # a deploy. Force revalidation on every request for HTML/vcard so a
    # push always shows up immediately; static assets (css/img) are fine
    # to let Cloudflare cache since they don't change without a rename.
    location ~ \.(html|vcf)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
